# Live stack: target app (5 services + mock bank), Postgres, Redis, load, and observability.
#   make up      start everything      http://localhost:3000 Grafana, :9090 Prometheus, :9093 Alertmanager
#   make down    stop and remove
x-svc: &svc
  build: {context: .., dockerfile: target_app/Dockerfile}
  restart: unless-stopped
  volumes: ["../results/live:/deploys"]
  labels: {incident-investigator: "service"}
  mem_limit: 512m
  cpus: 1.0

services:
  gateway:       {<<: *svc, environment: {SERVICE_NAME: gateway, PORT: "8000"}, ports: ["8000:8000"]}
  orders:        {<<: *svc, environment: {SERVICE_NAME: orders, PORT: "8001"}, ports: ["8001:8001"], depends_on: [postgres]}
  payments:      {<<: *svc, environment: {SERVICE_NAME: payments, PORT: "8002"}, ports: ["8002:8002"], depends_on: [postgres, mockbank]}
  inventory:     {<<: *svc, environment: {SERVICE_NAME: inventory, PORT: "8003"}, ports: ["8003:8003"], depends_on: [postgres]}
  notifications:
    <<: *svc
    environment: {SERVICE_NAME: notifications, PORT: "8004"}
    ports: ["8004:8004"]
    depends_on: [redis]
    tmpfs: ["/var/lib/notifications:size=256m"]       # small disk so the disk-full fault is real
  mockbank:      {<<: *svc, environment: {SERVICE_NAME: mockbank, PORT: "8005"}, ports: ["8005:8005"]}
  loadgen:
    build: {context: .., dockerfile: target_app/Dockerfile}
    command: ["python", "-m", "target_app.loadgen"]
    environment: {TARGET: "http://gateway:8000/api/work", RPS: "20"}
    depends_on: [gateway]
  postgres:
    image: postgres:16
    environment: {POSTGRES_PASSWORD: postgres}
    command: ["postgres", "-c", "max_connections=200"]
  redis:
    image: redis:7
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./prometheus:/etc/prometheus"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["9090:9090"]
  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes: ["./alertmanager:/etc/alertmanager"]
    ports: ["9093:9093"]
  loki:
    image: grafana/loki:3.0.0
    ports: ["3100:3100"]
  promtail:
    image: grafana/promtail:3.0.0
    volumes: ["/var/run/docker.sock:/var/run/docker.sock", "./loki:/etc/promtail"]
    command: ["-config.file=/etc/promtail/promtail.yml"]
  grafana:
    image: grafana/grafana:11.0.0
    environment: {GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"}
    volumes: ["./grafana:/etc/grafana/provisioning/datasources"]
    ports: ["3000:3000"]
