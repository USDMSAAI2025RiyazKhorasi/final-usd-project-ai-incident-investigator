global: {scrape_interval: 5s, evaluation_interval: 5s}
rule_files: [alert_rules.yml]
alerting: {alertmanagers: [{static_configs: [{targets: ["alertmanager:9093"]}]}]}
scrape_configs:
  - job_name: services
    static_configs:          # the service label is added here, so app metrics need no service label
      - {targets: ["gateway:8000"], labels: {service: gateway}}
      - {targets: ["orders:8001"], labels: {service: orders}}
      - {targets: ["payments:8002"], labels: {service: payments}}
      - {targets: ["inventory:8003"], labels: {service: inventory}}
      - {targets: ["notifications:8004"], labels: {service: notifications}}
