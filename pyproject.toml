[project]
name = "incident-investigator"
version = "1.0.0"
description = "Evidence-validated, critic-driven multi-agent root-cause analysis for microservices"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6", "pyyaml>=6", "numpy>=1.24"]

[project.optional-dependencies]
analysis = ["matplotlib>=3.7"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "streamlit>=1.35", "pandas>=2.0"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
